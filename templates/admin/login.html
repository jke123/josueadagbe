{% extends "admin/base.html" %}
{% block title %}Connexion{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto bg-white dark:bg-gray-800 p-8 rounded shadow mt-20">
    <h1 class="text-2xl font-bold mb-6 text-center">Connexion Admin</h1>
    <form method="POST" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="email" name="email" placeholder="Email" required
            class="w-full px-4 py-2 rounded border border-gray-300 dark:border-gray-700 dark:bg-gray-900">
        <input type="password" name="password" placeholder="Mot de passe" required
            class="w-full px-4 py-2 rounded border border-gray-300 dark:border-gray-700 dark:bg-gray-900">
        <button type="submit" class="w-full bg-primary text-white py-2 rounded hover:bg-secondary transition">
            Se connecter
        </button>
    </form>
</div>
{% endblock %}

{% extends "admin/base.html" %}
{% block title %}{{ 'Modifier' if project else 'Nouveau' }} projet{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-8">
    {{ 'Modifier le projet' if project else 'Nouveau projet' }}
</h1>

<form method="POST" enctype="multipart/form-data"
      class="bg-white dark:bg-gray-800 p-6 rounded shadow space-y-4 max-w-2xl">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
        <label class="block text-sm font-medium mb-1">Titre *</label>
        <input type="text" name="title" required value="{{ project.title if project else '' }}"
               class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Slug (URL)</label>
        <input type="text" name="slug" value="{{ project.slug if project else '' }}"
               class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Description</label>
        <textarea name="description" rows="4"
                  class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">{{ project.description if project else '' }}</textarea>
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Image</label>
        {% if project and project.image_url %}
        <img src="{{ project.image_url }}" class="w-40 h-24 object-cover rounded mb-2">
        {% endif %}
        <input type="file" name="image" accept="image/*"
               class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Lien démo</label>
        <input type="url" name="demo_url" value="{{ project.demo_url if project else '' }}"
               class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Lien code source</label>
        <input type="url" name="code_url" value="{{ project.code_url if project else '' }}"
               class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Technologies (séparées par des virgules)</label>
        <input type="text" name="technologies"
               value="{{ project.technologies|join(', ') if project and project.technologies else '' }}"
               class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div class="flex gap-6">
        <div>
            <label class="block text-sm font-medium mb-1">Position</label>
            <input type="number" name="position" value="{{ project.position if project else 0 }}"
                   class="w-24 px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
        </div>
        <div class="flex items-center gap-2 mt-6">
            <input type="checkbox" name="featured" id="featured"
                   {% if project and project.featured %}checked{% endif %}>
            <label for="featured">Mis en avant</label>
        </div>
    </div>

    <div class="flex gap-3 pt-4">
        <button type="submit" class="bg-primary text-white px-6 py-2 rounded hover:bg-secondary">
            {{ 'Mettre à jour' if project else 'Créer' }}
        </button>
        <a href="{{ url_for('admin.projects_list') }}" class="px-6 py-2 rounded border">Annuler</a>
    </div>
</form>
{% endblock %}

{% extends "admin/base.html" %}
{% block title %}Contact{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-8">Coordonnées de contact</h1>

<form method="POST" class="bg-white dark:bg-gray-800 p-6 rounded shadow space-y-4 max-w-2xl">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input type="email" name="email" value="{{ contact.email or '' }}"
               class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Téléphone</label>
        <input type="text" name="phone" value="{{ contact.phone or '' }}"
               class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Adresse</label>
        <input type="text" name="address" value="{{ contact.address or '' }}"
               class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">LinkedIn (URL)</label>
        <input type="url" name="linkedin" value="{{ contact.linkedin or '' }}"
               class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">GitHub (URL)</label>
        <input type="url" name="github" value="{{ contact.github or '' }}"
               class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Twitter / X (URL)</label>
        <input type="url" name="twitter" value="{{ contact.twitter or '' }}"
               class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <button type="submit" class="bg-primary text-white px-6 py-2 rounded hover:bg-secondary">
        Enregistrer
    </button>
</form>
{% endblock %}

{% extends "admin/base.html" %}
{% block title %}{{ 'Modifier' if experience else 'Nouvelle' }} expérience{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-8">{{ 'Modifier' if experience else 'Nouvelle' }} expérience</h1>

<form method="POST" class="bg-white dark:bg-gray-800 p-6 rounded shadow space-y-4 max-w-2xl">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
        <label class="block text-sm font-medium mb-1">Poste *</label>
        <input type="text" name="title" required value="{{ experience.title if experience else '' }}"
               class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Entreprise</label>
        <input type="text" name="company" value="{{ experience.company if experience else '' }}"
               class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Lieu</label>
        <input type="text" name="location" value="{{ experience.location if experience else '' }}"
               class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div class="flex gap-4">
        <div>
            <label class="block text-sm font-medium mb-1">Date début</label>
            <input type="date" name="start_date"
                   value="{{ experience.start_date.strftime('%Y-%m-%d') if experience and experience.start_date else '' }}"
                   class="px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Date fin</label>
            <input type="date" name="end_date"
                   value="{{ experience.end_date.strftime('%Y-%m-%d') if experience and experience.end_date else '' }}"
                   class="px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
        </div>
        <div class="flex items-center gap-2 mt-6">
            <input type="checkbox" name="is_current" id="is_current"
                   {% if experience and experience.is_current %}checked{% endif %}>
            <label for="is_current">En cours</label>
        </div>
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Description</label>
        <textarea name="description" rows="4"
                  class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">{{ experience.description if experience else '' }}</textarea>
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Position</label>
        <input type="number" name="position" value="{{ experience.position if experience else 0 }}"
               class="w-24 px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div class="flex gap-3 pt-4">
        <button type="submit" class="bg-primary text-white px-6 py-2 rounded hover:bg-secondary">
            {{ 'Mettre à jour' if experience else 'Créer' }}
        </button>
        <a href="{{ url_for('admin.experiences_list') }}" class="px-6 py-2 rounded border">Annuler</a>
    </div>
</form>
{% endblock %}

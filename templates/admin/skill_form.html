{% extends "admin/base.html" %}
{% block title %}{{ 'Modifier' if skill else 'Nouvelle' }} compétence{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-8">{{ 'Modifier' if skill else 'Nouvelle' }} compétence</h1>

<form method="POST" class="bg-white dark:bg-gray-800 p-6 rounded shadow space-y-4 max-w-2xl">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
        <label class="block text-sm font-medium mb-1">Nom *</label>
        <input type="text" name="name" required value="{{ skill.name if skill else '' }}"
               class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Catégorie</label>
        <input type="text" name="category" value="{{ skill.category if skill else '' }}"
               placeholder="Frontend, Backend, DevOps..."
               class="w-full px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Niveau (0-100)</label>
        <input type="number" name="level" min="0" max="100"
               value="{{ skill.level if skill else 50 }}"
               class="w-24 px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Position</label>
        <input type="number" name="position" value="{{ skill.position if skill else 0 }}"
               class="w-24 px-4 py-2 rounded border dark:bg-gray-900 dark:border-gray-700">
    </div>

    <div class="flex gap-3 pt-4">
        <button type="submit" class="bg-primary text-white px-6 py-2 rounded hover:bg-secondary">
            {{ 'Mettre à jour' if skill else 'Créer' }}
        </button>
        <a href="{{ url_for('admin.skills_list') }}" class="px-6 py-2 rounded border">Annuler</a>
    </div>
</form>
{% endblock %}
